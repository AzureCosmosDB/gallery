name: Apply gallery review command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: gallery-content-audit
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event.issue.pull_request &&
      contains(github.event.comment.body, 'Reject:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
      REVIEW_COMMAND: ${{ github.event.comment.body }}
    steps:
      - name: Authorize commenter
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$COMMENTER/permission" --jq .permission)
          case "$permission" in
            admin|maintain|write) ;;
            *) echo "Write, maintain, or admin permission is required."; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate command target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefName --jq .headRefName)
          base_ref=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)
          head_repo=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.repo.full_name)
          state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          case "$head_ref" in
            automation/gallery-content-updates-*) ;;
            *) echo "Review commands apply only to generated gallery maintenance branches."; exit 1 ;;
          esac
          test "$base_ref" = "main" || { echo "Maintenance pull request must target main."; exit 1; }
          test "$head_repo" = "$GITHUB_REPOSITORY" || { echo "Maintenance pull request must originate in this repository."; exit 1; }
          test "$state" = "OPEN" || { echo "Maintenance pull request is not open."; exit 1; }
          echo "UPDATE_BRANCH=$head_ref" >> "$GITHUB_ENV"

      - name: Prepare command and catalog files
        run: |
          mkdir -p "$RUNNER_TEMP/gallery-review"
          cp scripts/gallery-audit/review-command.mjs "$RUNNER_TEMP/gallery-review/review-command.mjs"
          cp scripts/gallery-audit/promotion.mjs "$RUNNER_TEMP/gallery-review/promotion.mjs"
          cp scripts/gallery-audit/normalize.mjs "$RUNNER_TEMP/gallery-review/normalize.mjs"
          git fetch origin main "$UPDATE_BRANCH"
          git show origin/main:static/templates.json > "$RUNNER_TEMP/base-templates.json"
          git show origin/main:static/retired-templates.json > "$RUNNER_TEMP/base-retired-templates.json"
          git checkout -B "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"

      - name: Apply rejected items
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" \
          BASE_CATALOG_PATH="$RUNNER_TEMP/base-templates.json" \
          CATALOG_PATH="static/templates.json" \
          BASE_RETIRED_PATH="$RUNNER_TEMP/base-retired-templates.json" \
          RETIRED_PATH="static/retired-templates.json" \
          SUMMARY_PATH="$RUNNER_TEMP/promotion-summary.md" \
          RESULT_PATH="$RUNNER_TEMP/review-result.json" \
          node "$RUNNER_TEMP/gallery-review/review-command.mjs"

          status=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/review-result.json')).status")
          if [ "$status" != "applied" ]; then
            message=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/review-result.json')).message")
            printf 'Unable to apply review command: %s\n' "$message" > "$RUNNER_TEMP/review-response.md"
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/review-response.md"
            exit 1
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate revised proposal
        run: |
          npm run test:gallery-audit
          npm run build

      - name: Publish revised proposal
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- static/templates.json static/retired-templates.json; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The requested items were already absent from the proposal."
            exit 0
          fi

          git config user.name "gallery-content-review-automation"
          git config user.email "gallery-content-review-automation@users.noreply.github.com"
          git add static/templates.json static/retired-templates.json
          git commit -m "chore: apply gallery review command"
          gh auth setup-git
          git push origin "HEAD:$UPDATE_BRANCH"
          gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/promotion-summary.md"
          rejected=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/review-result.json')).rejectedIds.join(', ')")
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Applied rejected items: $rejected. The revised proposal passed tests and the static build."